<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="container">
    <h3>Payment Form</h3>
    <div class="row">
      <div class="form-group col">
        <label for="">Reciver Name</label><br>
        <input type="text" (input)="onNameChange($event)">
      </div>
      <div class="col">
        <label for="">Resiver Name</label>
        <p>{{nameInput | titlecase}}</p>
      </div>
    </div>
    <div class="row">
      <div class="form-group col">
        <label for="">Payment Date</label><br>
        <input type="date" (input)="onDateChange($event)">
      </div>
      <div class="col">
        <label for="">Payment Date</label>
        <p>{{dateInput | date : 'MMMM d, y'}}</p>
      </div>
    </div>
    <div class="row">
      <div class="form-group col">
        <label for="">Amount Date</label><br>
        <input type="text" (input)="onCurrencyChange($event)">
      </div>
      <div class="col">
        <label for="">Amount Date</label>
        <p>{{currencyInput | currency }}</p>
      </div>
    </div>
  </div>
</body>

</html>
