<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <app-cards
      *ngFor="let post of posts"
      [title]="post.title"
      [ImageUrl]="post.ImageUrl"
      [UserName]="post.UserName"
      [Caption]="post.Caption"
      class="appCard"
    >
    </app-cards>
  </body>
</html>
